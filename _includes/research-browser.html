{% comment %}
  _includes/research-browser.html
  Publication browser for NCEL website.
  Data is injected as PUB_DATA (JSON) from site.data.citations + sources.yaml.
  All interactive logic lives in _scripts/publications.js.
  Styles live in _styles/publications.scss.
{% endcomment %}

<div id="pub-browser" role="main" aria-label="Publication browser">

  <!-- ── Toolbar ──────────────────────────────────────────────────────── -->
  <div class="pub-toolbar" role="search" aria-label="Filter publications">

    <div class="pub-toolbar__group">
      <label class="pub-toolbar__label" for="pub-search">Search</label>
      <input
        id="pub-search"
        class="pub-toolbar__search"
        type="text"
        placeholder="title, author, journal, keyword…"
        autocomplete="off"
        aria-label="Search publications"
      >
    </div>

    <div class="pub-toolbar__divider" aria-hidden="true"></div>

    <div class="pub-toolbar__group">
      <label class="pub-toolbar__label" for="pub-sort">Sort</label>
      <select id="pub-sort" aria-label="Sort order">
        <option value="year-desc">Year ↓</option>
        <option value="year-asc">Year ↑</option>
        <option value="title-asc">Title A–Z</option>
      </select>
    </div>

    <div class="pub-toolbar__group">
      <label class="pub-toolbar__label" for="pub-year">Year</label>
      <select id="pub-year" aria-label="Filter by year">
        <option value="">All years</option>
        {% assign pub_years = "" | split: "" %}
        {% for c in site.data.citations %}
          {% assign yr = c.date | slice: 0, 4 %}
          {% if yr and yr != "" %}
            {% unless pub_years contains yr %}
              {% assign pub_years = pub_years | push: yr %}
            {% endunless %}
          {% endif %}
        {% endfor %}
        {% assign pub_years = pub_years | sort | reverse %}
        {% for y in pub_years %}
          {% if y and y != "" %}
            <option value="{{ y }}">{{ y }}</option>
          {% endif %}
        {% endfor %}
      </select>
    </div>

    <div class="pub-toolbar__group">
      <label class="pub-toolbar__label" for="pub-limit">Show</label>
      <select id="pub-limit" aria-label="Limit publication type">
        <option value="">All</option>
        <option value="published">Published only</option>
        <option value="preprint">Preprints only</option>
        <option value="featured">Featured only</option>
      </select>
    </div>

  </div><!-- /.pub-toolbar -->

  <!-- ── View tabs ────────────────────────────────────────────────────── -->
  <div class="pub-tabs" role="tablist" aria-label="Publication views">
    <button class="pub-tab is-active" role="tab" aria-selected="true"  data-view="year"     >By Year</button>
    <button class="pub-tab"           role="tab" aria-selected="false" data-view="topic"    >By Topic</button>
    <button class="pub-tab"           role="tab" aria-selected="false" data-view="featured" >Featured</button>
    <button class="pub-tab"           role="tab" aria-selected="false" data-view="preprint" >Preprints</button>
  </div>

  <!-- ── Status ───────────────────────────────────────────────────────── -->
  <div id="pub-status" class="pub-status" aria-live="polite"></div>

  <!-- ── Panels ───────────────────────────────────────────────────────── -->
  <div id="pub-panel-year"     class="pub-panel is-active" role="tabpanel"></div>
  <div id="pub-panel-topic"    class="pub-panel"           role="tabpanel"></div>
  <div id="pub-panel-featured" class="pub-panel"           role="tabpanel"></div>
  <div id="pub-panel-preprint" class="pub-panel"           role="tabpanel"></div>

</div><!-- /#pub-browser -->

<!-- ── Data injection (Liquid → JS) ──────────────────────────────────── -->
<script>
var PUB_DATA = [
  {% for c in site.data.citations %}
  {% if c.title and c.title != "Web of Science" %}
  {
    title:     {{ c.title     | default: "" | jsonify }},
    authors:   {{ c.authors   | join: ", " | jsonify }},
    publisher: {{ c.publisher | default: "" | jsonify }},
    date:      {{ c.date      | default: "" | jsonify }},
    year:      {{ c.date | slice: 0, 4 | jsonify }},
    link:      {{ c.link      | default: "" | jsonify }},
    id:        {{ c.id        | default: "" | jsonify }},
    doi:       {{ c.doi       | default: c.id | default: "" | jsonify }},
    abstract:  {{ c.abstract  | default: c.description | default: "" | jsonify }},
    topics:    {{ c.topics    | default: c.tags | default: "" | jsonify }},
    keywords:  {{ c.keywords  | default: "" | jsonify }},
    pdf:       {{ c.pdf       | default: "" | jsonify }},
    materials: {{ c.materials | default: "" | jsonify }},
    code:      {{ c.code      | default: "" | jsonify }},
    bibtex:    {{ c.bibtex    | default: "" | jsonify }},
    preprint:  {{ c.preprint  | default: false | jsonify }},
    featured:  {{ c.featured  | default: false | jsonify }}
  }{% unless forloop.last %},{% endunless %}
  {% endif %}
  {% endfor %}
];
</script>
