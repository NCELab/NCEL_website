name: on-push
run-name: on push to main

on:
  push:
    branches:
      - main

  # run if user manually requests it
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  # NOTE: publications are maintained by hand in _data/citations.yaml.
  # The automatic citation pipeline (_cite) has been removed, so there is
  # no update-citations job here any more — we go straight to building.
  build-site:
    uses: ./.github/workflows/build-site.yaml
