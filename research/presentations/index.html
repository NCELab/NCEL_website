<script>
  // Mark current page in navigation
  document.addEventListener('DOMContentLoaded', function() {
    const currentPath = window.location.pathname;
    
    // Mark top-level nav items
    document.querySelectorAll('.nav-link').forEach(link => {
      const href = link.getAttribute('href') || link.getAttribute('data-dropdown');
      if (href && currentPath.startsWith(href)) {
        link.classList.add('is-active');
        link.setAttribute('aria-current', 'page');
      }
    });
    
    // Mark submenu items
    document.querySelectorAll('.dropdown-item').forEach(link => {
      if (link.getAttribute('href') === currentPath || 
          currentPath.startsWith(link.getAttribute('href').replace(/\/$/, ''))) {
        link.classList.add('is-active');
        link.setAttribute('aria-current', 'page');
        
        // Also mark parent as active
        const menu = link.closest('.dropdown-menu');
        if (menu) {
          const toggle = document.querySelector(`[data-dropdown="${menu.id}"]`);
          if (toggle) {
            toggle.classList.add('is-active');
          }
        }
      }
    });
  });
</script>

        abstract: "Direct trauma exposure is associated with long-term adverse mental and physical health outcomes; however, research on the effects of intergenerational transmission of trauma (ITT) has focused primarily on psychiatric outcomes in offspring. We examined whether parental occupational exposure among PTSD-affected World Trade Center (WTC) responders to the 9/11 terrorist attacks was associated with increased physical and psychiatric health problems in their adult offspring. Participants were adult offspring in our ITT baseline study (N = 270). Multinomial regression models examined the associations between parental 9/11 exposures, offspring-reported post-9/11 family experiences, and 4 types of physical and/or psychiatric outcomes (neither, psychiatric only, physical only, both). Additional analyses evaluated age at the time of 9/11 as a moderator. Greater parental occupational trauma exposure was associated with increased risk of offspring physical–psychiatric comorbidity, with the strongest associations among offspring who were younger at the time of the attacks. Parental exposure to human remains during rescue and recovery efforts was associated with significantly greater odds of offspring comorbidity. In contrast, parental dust cloud exposure and longer work hours at the WTC site during the acute response period were associated with lower odds of psychiatric-only and physical-only outcomes, respectively. These findings extend current models of ITT beyond psychiatric outcomes, demonstrating that the multimorbidity health consequences of trauma may also extend across generations.",

        abstract: "Trauma-related psychopathology is associated with biases in socioemotional information processing, yet how trauma-related symptoms influence the interpretation of emotional valence to neutral facial expressions remains unclear. World Trade Center responders with PTSD (n=167) and their adult offspring (n=249) completed an online facial expression task in which they viewed neutral, happy, fearful, and angry faces and judged each expression as positive or negative. Mixed-effects logistic regression models estimated the odds of a negative interpretation, and linear mixed-effects models examined log-transformed reaction times. Each model adjusted for demographics and accounted for repeated observations within participants, families, and stimulus types; reaction time analyses also adjusted for device. Across generations, happy faces were almost uniformly judged as positive and fearful and angry faces were predominantly judged as negative. In contrast, judgments of neutral faces varied substantially. Greater PTSD and panic symptom severity, but not depression or generalized anxiety symptoms, were associated with increased odds of interpreting neutral faces as negative (OR [95% CI] = 1.22 [1.05, 1.41] and 1.20 [1.06, 1.36] for PTSD and panic symptoms, respectively). Offspring responded faster than parents, but patterns were similar across generations. These findings suggest that trauma-related symptoms are associated with a negative interpretation bias when assigning emotional meaning to neutral facial cues, highlighting a potential cognitive mechanism underlying posttraumatic psychopathology.",
