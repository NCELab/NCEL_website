<!DOCTYPE html PUBLIC "-//W3C//DTD HTML 4.0 Transitional//EN" "http://www.w3.org/TR/REC-html40/loose.dtd">
<html><body>
<h1 id="-publications">
<i class="icon fa-solid fa-microscope"></i> Publications</h1>

<!-- section break -->
<!--
  <background></background>

  <size></size>
-->

<div id="pub-browser" role="main" aria-label="Publication browser">

  <!-- ── Intro note ────────────────────────────────────────────────────── -->
  <p class="pub-intro-note">
    The research at NCEL reflects our long-term trajectory in understanding
    cognitive control and neurodevelopment, as well as collaborative breakthroughs
    achieved alongside our dedicated lab members.
  </p>

  <!-- ── Section tabs ─────────────────────────────────────────────────── -->
  <div class="pub-section-tabs" role="tablist" aria-label="Publication sections">
    <button class="pub-section-tab" role="tab" aria-selected="false" data-section="all">All Publications</button>
    <button class="pub-section-tab" role="tab" aria-selected="false" data-section="peer-review">Peer Review</button>
  </div>

  <!-- ── Toolbar (search + sort + year — shared) ──────────────────────── -->
  <div class="pub-toolbar" role="search" aria-label="Filter publications">
    <div class="pub-toolbar__group">
      <label class="pub-toolbar__label" for="pub-search">Search</label>
      <input id="pub-search" class="pub-toolbar__search" type="text" placeholder="title, author, journal, keyword…" autocomplete="off" aria-label="Search publications">
    </div>

    <div class="pub-toolbar__divider" aria-hidden="true"></div>

    <div class="pub-toolbar__group">
      <label class="pub-toolbar__label" for="pub-sort">Sort</label>
      <select id="pub-sort" aria-label="Sort order">
        <option value="year-desc">Year ↓</option>
        <option value="year-asc">Year ↑</option>
        <option value="title-asc">Title A–Z</option>
      </select>
    </div>

    <div class="pub-toolbar__group">
      <label class="pub-toolbar__label" for="pub-year">Year</label>
      <select id="pub-year" aria-label="Filter by year">
        <option value="">All years</option>
        
        
        
        
      </select>
    </div>
  </div>

  <!-- ── Status ───────────────────────────────────────────────────────── -->
  <div id="pub-status" class="pub-status" aria-live="polite"></div>

  <!-- ── Section panels ───────────────────────────────────────────────── -->


  <!-- 3. All Publications -->
  <div id="pub-panel-all" class="pub-section-panel" role="tabpanel">
    <div id="pub-list-all" class="pub-list"></div>
  </div>
  <!-- Peer Review -->
<div id="pub-panel-peer-review" class="pub-section-panel" role="tabpanel">
  <div id="pub-list-peer-review" class="pub-list"></div>
</div>
