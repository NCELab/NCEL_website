<script>
  // Mark current page in navigation
  document.addEventListener('DOMContentLoaded', function() {
    const currentPath = window.location.pathname;
    
    // Mark top-level nav items
    document.querySelectorAll('.nav-link').forEach(link => {
      const href = link.getAttribute('href') || link.getAttribute('data-dropdown');
      if (href && currentPath.startsWith(href)) {
        link.classList.add('is-active');
        link.setAttribute('aria-current', 'page');
      }
    });
    
    // Mark submenu items
    document.querySelectorAll('.dropdown-item').forEach(link => {
      if (link.getAttribute('href') === currentPath || 
          currentPath.startsWith(link.getAttribute('href').replace(/\/$/, ''))) {
        link.classList.add('is-active');
        link.setAttribute('aria-current', 'page');
        
        // Also mark parent as active
        const menu = link.closest('.dropdown-menu');
        if (menu) {
          const toggle = document.querySelector(`[data-dropdown="${menu.id}"]`);
          if (toggle) {
            toggle.classList.add('is-active');
          }
        }
      }
    });
  });
</script>

    abstract:  "Family history (FH+) of substance use disorder (SUD) is an established risk factor for offspring SUD. The extent to which offspring psychological traits or the family environment, each of which may be relevant to familial transmission of SUD risk, vary by FH+ in socioeconomically disadvantaged populations is less clear. We compared the family/social environmental and psychological characteristics of 73 FH+ and 69 FH- youth ages 12-16, from a study of parental criminal justice system involvement in a primarily low-income, minority urban population. A latent profile analysis (LPA) empirically identified groups of subjects with similar psychological characteristics, which were then compared by FH+. FH+ youths were found to have greater mean household size, greater parental psychological aggression, and a higher mean number of adverse childhood experiences, even without considering parental SUD. FH+ individuals had lower report card grades according to parental report and were more likely to have a history of externalizing disorders than FH- individuals. However, FH+ was not significantly associated with many psychological characteristics or with the class membership from the LPA. In conclusion, among a population of low-income, minority urban youth, FH+ was associated with differences in the family environment and only subtle differences in individual psychological characteristics.",

    abstract:  "Adolescence is a period of dramatic physiological changes preparing individuals to face future challenges. Prolonged exposure to stressors during childhood can result in dysregulated stress systems which alter normative physiological progression, leading to exacerbated risk for developing psychiatric disorders. Parental substance use disorder (SUD) is considered a significant childhood stressor which increases risk for the offspring to develop SUD. Thus, it is important to understand stress reactivity among adolescents with parental SUD. We used the Trier Social Stress Task (TSST), which includes a public speech presentation, as an acute stressor. Changes in heart-rate (HR) were measured while disadvantaged minority adolescents with and without a family history (FH+/FH-) of SUD performed the TSST. We investigated sex-specific stress response patterns during the TSST. HR peaked during the speech presentation and was overall higher in females than males. Changes in HR measures between baseline and speech showed an interaction between biological sex and FH group. Specifically, FH- females and FH+ males had significantly larger positive HR changes than FH- males. These results suggest that male and female adolescents with parental SUD have atypical, but divergent changes in stress reactivity that could explain their increased risk for developing SUD via different sexually dimorphic mechanisms.",

    abstract:  "Background: The COVID-19 Pandemic resulted in high levels of fear, anxiety, and stress. People with pre-existing physical and mental health conditions may have been more affected by the sudden changes in daily habits during the initial months of global quarantine imposed during the COVID-19 pandemic. Methods: We designed the Quarantine, Anxiety, and Diet (QUAD) Survey to investigate the effect of pre-existing health conditions on the relationship of COVID-19 stress and food behavior. The anonymous survey was distributed online and only adults were eligible to participate. Results: The results showed that responders with pre-existing health conditions differed from healthy participants in eating behavior during this time of stress. Compared to those classified as healthy, fewer people with pre-existing physical illness showed an increase in appetite with stress during the COVID-19 pandemic. Responders with pre-existing psychiatric illness were more likely to show increases or decreases in appetite with stress compared to healthy responders. Furthermore, higher BMI was associated with higher rate of increased appetite, whereas low BMI showed a higher rate of decreased appetite, both compared to normal BMI. Conclusion: The QUAD Survey demonstrated that individuals with pre-COVID-19 psychiatric conditions are at a higher risk of maladaptive food behavior under stress. Since pre-existing psychiatric illnesses and acute stressors are known risk factors for eating disorders, special attention should be placed on those at risk to mediate the psychological and physical effects of stress and anxiety.",

    title:     "Shapes of subcortical structures in adolescents with and without familial history of substance use disorder",
    authors:   "Zhishun Wang, Diana V. Rodriguez-Moreno, Yael M. Cycowicz, Lawrence V. Amsel, Keely Cheslack-Postava, Xiaofu He, Megan Ryan, Lupo Geronazzo-Alman, George J. Musa, Adam Bisaga, Christina W. Hoven",

    abstract:  "It has been suggested that intergenerational transmission of risk for substance use disorder (SUD) manifests in the brain anatomy of substance naive adolescents. While volume and shapes of subcortical structures (SSS) have been shown to be heritable, these structures, especially the pallidum, putamen, nucleus accumbens, and hippocampus, have also been associated with substance use disorders. However, it is not clear if those anatomical differences precede substance use or are the result of that use. Therefore, we examined if volume and SSS of adolescents with a family history (FH+) of SUD differed from adolescents without such a history (FH-). Because risk for SUD is associated with anxiety and impulsivity, we also examined correlations between these psychological characteristics and volume/SSS. Using structural MRI and FSL software, we segmented subcortical structures and obtained indices of SSS and volumes of 64 FH+ and 58 FH- adolescents. We examined group differences in volume and SSS, and the correlations between volume/SSS and trait anxiety and impulsivity. FH+ adolescents had a significant inward deformation in the shape of the right anterior hippocampus compared to FH- adolescents, while the volume of this structure did not differ between groups. Neither shape nor volume of the other subcortical structures differed between groups. In the FH+ adolescents, the left hippocampus shape was positively correlated with both trait anxiety and impulsivity, while in FH- adolescents a negative correlation pattern of SSS was seen in the hippocampus. SSS appears to capture local anatomical features that traditional volumetric analysis does not. The inward shape deformation in the right anterior hippocampus in FH+ adolescents may be related to the known increased risk for behavioral dysregulation leading to SUD in FH+ offspring. Hippocampus shape also exhibits opposite patterns of correlation with anxiety and impulsivity scores across the FH+ and FH- adolescents. These novel findings may reveal neural correlates, not captured by traditional volumetric analysis, of familial transmission of increased vulnerability to SUD.",

    doi:       "doi:10.1016/j.neuroimage.2021.118746",
    abstract:  "The ability to process and respond to external input is critical for adaptive behavior. Why, then, do neural and behavioral responses vary across repeated presentations of the same sensory input? Ongoing fluctuations of neuronal excitability are currently hypothesized to underlie the trial-by-trial variability in sensory processing. To test this, we capitalized on intracranial electrophysiology in neurosurgical patients performing an auditory discrimination task with visual cues: specifically, we examined the interaction between prestimulus alpha oscillations, excitability, task performance, and decoded neural stimulus representations. We found that strong prestimulus oscillations in the alpha+ band (i.e., alpha and neighboring frequencies), rather than the aperiodic signal, correlated with a low excitability state, indexed by reduced broadband high-frequency activity. This state was related to slower reaction times and reduced neural stimulus encoding strength. We propose that the alpha+ rhythm modulates excitability, thereby resulting in variability in behavior and sensory representations despite identical input.",

    authors:   "Xiaofu He, Diana V. Rodriguez-Moreno, Yael M. Cycowicz, Keely Cheslack-Postava, Huilan Tang, Zhishun Wang, Lawrence V. Amsel, Megan Ryan, Lupo Geronazzo-Alman, George J. Musa, Adam Bisaga, Christina W. Hoven",
    publisher: "Neuroimage: Reports",

    doi:       "doi:10.1016/j.ynirp.2021.100037",
    abstract:  "A family history (FH+) of substance use disorder (SUD) increases an adolescent's risk for substance use initiation and progression. Greater impulsivity and reward seeking behavior is known to be associated with such risk. At the neurological level, dysfunction of cortico- striatal and cortico-limbic pathways have been proposed as contributors to the increased SUD risk in adolescents with FH+. In addition, disadvantaged environments have been associated with atypical brain connectivity and higher SUD risk. However, it remains unclear if this increased risk is manifested in structural and functional brain abnormalities prior to regular drug use. To examine this, we employed complementary imaging of structural and functional connectivity of 60 FH+ and 55 FH- minority adolescents, all from families with low socio-economic status. We acquired diffusion tensor-imaging (DTI) and resting state fMRI data across the whole brain. Structural connectivity was examined by measuring fractional anisotropy (FA) using DTI, to indicate integrity of the white matter tracts. Functional connectivity within and between resting state networks was assessed by the correlation of blood-oxygen-level-dependent (BOLD) signal between intra and inter-network nodes. Psychological measures of impulsivity and reward seeking were also obtained with standardized measures, the BIS-11 and the BIS/BAS, and their association with FA and functional connectivity was evaluated. We found no differences in white matter integrity between the groups. Compared to FH-, FH+ adolescents showed significantly greater functional connectivity between posterior regions of the Default Mode Network (DMN) and the Fronto-Parietal Network (FPN). While psychological measures of reward seeking behavior did not differ between the FH+ and FH- groups, impulsivity, assessed by the BIS-11, was significantly higher for FH+. However, we did not find significant differences between the FH+ and FH- groups when comparing associations of BIS-11 scores and white matter integrity or functional connectivity measures. The stronger inter-network functional connectivity between the DMN and FPN in FH+ adolescents suggests that transmitted risk for SUD may be related to large- scale brain dynamics. The lack of structural differences support the importance of early prevention efforts for FH+ adolescents, before initiation of drug use, allowing for healthy brain development.",

    abstract:  "Adolescents with a family history (FH+) of substance use disorder (SUD) are at a greater risk for SUD, suggested to be partly due to the transmission of behavioral impulsivity. We used a delay discounting task to compare impulsivity in decision-making and its associated brain functioning among FH+ and FH- minority adolescents. Participants chose between Smaller Sooner (SS) and Larger Later (LL) rewards. The SS was available immediately (Now trials) or in the future (Not-Now trials), allowing for greater differentiation between impulsive decisions. The FH+ group showed greater impatience by responding SS more frequently than the FH- group, only on the Now trials, and even when the relative reward differences (RRD) increased. Surprisingly, there were no differences in brain activity between the groups. Combined, the groups showed greater reward activity during the Now vs. Not-Now trials in medial prefrontal/anterior cingulate, posterior cingulate, precuneus, and inferior frontal gyrus (i.e., an immediacy effect). As the RRD increased activation in the reward network decreased, including the striatum, possibly reflecting easy decision-making. These results indicate that risk for SUD, seen behaviorally among FH+ adolescents, may not yet be associated with discernable brain changes, suggesting that early intervention has the potential to reduce this risk.",

    abstract:  "Objective: To examine the association between parental occupational exposure to traumatic events and their children's mental health in families of First Responders (FRs), a neglected area of research. Methods: In 208 families of Israeli FRs, children's symptoms and comorbidity patterns of seven psychiatric disorders were regressed on parental work-related variables, controlling for relevant covariates. Results: Having a father working as a FR and higher paternal exposure were associated with a greater number of separation anxiety and posttraumatic stress symptoms, respectively. Maternal exposure was associated with a greater number of symptoms of generalized anxiety, panic disorder, depression, and oppositional defiant disorder, and with increased odds of comorbid internalizing symptomatology. Conclusions: Additional research on children of FRs is encouraged. An adaption to this understudied population of family-centered interventions available for military families could inform targeted prevention efforts.",

    abstract:  "For children, new experiences occur very often, and learning to differentiate between old and new events is a fundamental process necessary for appropriate reactions to stimuli. Thus the present study is concerned with maturation of brain responses to repeated novel events. We examined the effect of repetition of familiar (meaningful) and unfamiliar (meaningless) symbols on the event-related-potentials (ERPs) recorded during novelty oddball and recognition memory tasks from children, adolescents and young adults. During the novelty oddball task, repetition of the familiar symbols elicited a reduction in the novelty P3 in the ERPs of all age groups, while repetition of the unfamiliar symbols elicited a reduction in novelty P3 amplitude only in children. As expected, recognition memory performance improved with age and was better for familiar than unfamiliar symbols. For all age groups, ERPs to correctly recognized familiar old symbols elicited a larger positivity than ERPs to correctly identified new symbols, indicating a reliable memory effect. However, ERPs to unfamiliar old and new symbols did not differ in adults and adolescents but did differ in children. The data suggest that children process familiar visual symbols in a similar fashion to that of adults, and that children process unfamiliar symbols differently from adults.",

    abstract:  "Objective: Evidence suggests that magnetic seizure therapy (MST) results in fewer side effects than electroconvulsive treatment, both in humans treated with electroconvulsive therapy (ECT) as well as in the animal preclinical model that uses electroconvulsive shock (ECS). Evidence suggests that MST results in fewer cognitive side effects than ECT. Although MST offers enhanced control over seizure induction and spread, little is known about how MST and ECT seizures differ. Seizure characteristics are associated with treatment effect. This study presents quantitative analyses of electroencephalogram (EEG) power after electrical and magnetic seizure induction and anesthesia-alone sham in an animal model. The aim was to test whether differential neurophysiological characteristics of the seizures could be identified that support earlier observations that the powers of theta, alpha, and beta but not delta frequency bands were lower after MST when compared with those after ECS. Methods: In a randomized, sham-controlled trial, 24 macaca mulatte received 6 weeks of daily sessions while scalp EEG was recorded. Electroencephalogram power was quantified within delta, theta, alpha, and beta frequency bands. Results: Magnetic seizure therapy induced lower ictal expression in the theta, alpha and beta frequencies than ECS, but MST and ECS were indistinguishable in the delta band. Magnetic seizure therapy showed less postictal suppression than ECS. Increasing electrical dosage increased ictal power, whereas increasing MST dosage had no effect on EEG expression. Conclusions: Magnetic seizure therapy seizures have less robust electrophysiological expression than ECS, and these differences are largest in the alpha and beta bands. The relevance of these differences in higher frequency bands to clinical outcomes deserves further exploration. Significance: Contrasting EEG in ECS and MST may lead to insights on the physiological underpinnings of seizure-induced amnesia and     doi:       "doi:10.1089/brain.2014.0272",
    abstract:  "Speech comprehension studies have generally focused on the isolation and function of regions with positive blood oxygen level dependent (BOLD) signals with respect to a resting baseline. Although regions with negative BOLD signals in comparison to a resting baseline have been reported in language-related tasks, their relationship to regions of positive signals is not fully appreciated. Based on the emerging notion that the negative signals may represent an active function in language tasks, the authors test the hypothesis that negative BOLD signals during receptive language are more associated with comprehension than content-free versions of the same stimuli. Regions associated with comprehension of speech were isolated by comparing responses to passive listening to natural speech to two incomprehensible versions of the same speech: one that was digitally time reversed and one that was muffled by removal of high frequencies. The signal polarity was determined by comparing the BOLD signal during each speech condition to the BOLD signal during a resting baseline. As expected, stimulation-induced positive signals relative to resting baseline were observed in the canonical language areas with varying signal amplitudes for each condition. Negative BOLD responses relative to resting baseline were observed primarily in frontoparietal regions and were specific to the natural speech condition. However, the BOLD signal remained indistinguishable from baseline for the unintelligible speech conditions. Variations in connectivity between brain regions with positive and negative signals were also specifically related to the comprehension of natural speech. These observations of anticorrelated signals related to speech comprehension are consistent with emerging models of cooperative roles represented by BOLD signals of opposite polarity.",

    abstract:  "Greater knowledge of cortical brain regions in reward processing may set the stage for using transcranial magnetic stimulation (TMS) as a treatment in patients with avolition, apathy or other drive-related symptoms. This study examined the effects of single pulse (sp) TMS to two reward circuit targets on drive in healthy subjects. Fifteen healthy subjects performed the monetary incentive delay task (MID) while receiving fMRI-guided spTMS to either inferior parietal lobe (IPL) or supplemental motor area (SMA). The study demonstrated decreasing reaction times (RT) for increasing reward. It also showed significant differences in RT modulation for TMS pulses to the IPL versus the SMA. TMS pulses during the delay period produced significantly more RT slowing when targeting the IPL than those to the SMA. This RT slowing carried over into subsequent trials without TMS stimulation, with significantly slower RTs in sessions that had targeted the IPL compared to those targeting SMA. The results of this study suggest that both SMA and IPL are involved in reward processing, with opposite effects on RT in response to TMS stimulation. TMS to these target cortical regions may be useful in modulating reward circuit deficits in psychiatric populations.",

    abstract:  "Objective: Conventional assessments of consciousness rely on motor responses to indicate awareness. However, overt behaviors may be absent or ambiguous in patients with disorders of consciousness (DOC) resulting in underrating capacity for cognition. fMRI during a silent picture-naming task was evaluated as an indicator of command following when conventional methods are not sufficient. Methods: A total of 10 patients with and without conventional evidence of awareness, who met diagnostic criteria for the minimally conscious state (MCS) (n = 5), vegetative state (VS) (n = 3), emerged from MCS (EMCS) (n = 1), and locked-in syndrome (LIS) (n = 1), participated in this observational fMRI study. Results: The LIS and EMCS patients engaged a complete network of essential language-related regions during the object-naming task. The MCS and 2 of the VS patients demonstrated both complete and partial preservation of the object- naming system. Patients who engaged a complete network scored highest on the Coma Recovery Scale-Revised. Conclusions: This study supports the view that fMRI during object naming can elicit brain activations in patients with DOC similar to those observed in healthy subjects during command following, and patients can be stratified by completeness of the engaged neural system. These results suggest that activity of the language network may serve as an indicator of high-level cognition and possibly volitional processes that cannot be discerned through conventional behavioral assessment alone.",

    abstract:  "In the absence of \"hard\" neurophysiologic markers, the burden of proof for establishing conscious awareness in individuals who sustain severe brain injury lies in behavioral assessment. Because behavior represents indirect evidence of consciousness, reliance on behavioral markers presents significant challenges and may lead to misdiagnosis. Detection of conscious awareness is confounded by numerous factors including fluctuations in arousal level, difficulty differentiating reflexive or involuntary movement from intentional behavior, underlying sensory and motor impairments, and medication side effects. When an ambiguous behavior is observed, the onus falls to the clinician to determine where along the continuum of unconsciousness to consciousness, it lies. This paper (1) summarizes the current diagnostic criteria for coma, the vegetative state, and the minimally conscious state, (2) describes current behavioral assessment methods, (3) discusses the limitations of behavioral assessment techniques, (4) reviews recent applications of functional neuroimaging in the assessment of patients with disorders of consciousness, and (5) concludes with a case study that illustrates the disparity between behavioral and functional neuroimaging findings that may be encountered in this population.",

  {

    authors:   "Yael M. Cycowicz, Bruce Luber, Timothy Spellman, Sarah H. Lisanby",
    publisher: "The Journal of ECT",

    doi:       "doi:10.1097/yct.0b013e31818dd40a",
    abstract:  "Magnetic seizure therapy (MST) is under development as a means of improving cognitive outcomes with convulsive therapy through achieving better control over therapeutic seizure induction than is possible with conventional electroconvulsive therapy. In this investigation, we present the first neurophysiological characterization of high-dose MST (HD-MST, 6x seizure threshold) to see if a higher dose that is often used in human trials retains differential expression relative to electroconvulsive shock (ECS) and to explore the relationship between seizure expression and cognitive outcomes. To this end, rhesus monkeys received 4 weeks of daily treatment with ECS, HD-MST, and anesthesia-alone sham in counterbalanced order, with an interposed recovery period. Two channels of electroencephalogram were recorded during and immediately after the ictal period. Electroencephalogram power within delta, theta, alpha, and beta frequency bands was calculated. Electroconvulsive shock showed significantly more ictal power in all frequency bands than HD-MST (P < 0.01). Electroencephalogram power during the postictal period was significantly different among conditions only for the delta band. Higher ictal expression with ECS was associated with slowed completion time for an orientation task given immediately after the treatments. Our results support earlier findings demonstrating that MST- and ECS-induced seizures elicit differential patterns of ictal expression, consistent with the relatively more superficial stimulation achieved via magnetic induction in comparison with conventional electroconvulsive therapy. These results demonstrate that MST, even at high dose, results in seizures that differ neurophysiologically from ECS. It further suggests that some of the differences in ictal expression may relate to the improved cognitive outcomes seen with MST.",

    abstract:  "This report identifies evidence of partially functional cerebral regions in catastrophically injured brains. To study five patients in a persistent vegetative state (PVS) with different behavioural features, we employed [(18)F]fluorodeoxyglucose-positron emission tomography (FDG- PET), MRI and magnetoencephalographic (MEG) responses to sensory stimulation. Each patient's brain expressed a unique metabolic pattern. In three of the five patients, co-registered PET/MRI correlate islands of relatively preserved brain metabolism with isolated fragments of behaviour. Two patients had suffered anoxic injuries and demonstrated marked decreases in overall cerebral metabolism to 30-40% of normal. Two other patients with non-anoxic, multifocal brain injuries demonstrated several isolated brain regions with relatively higher metabolic rates, that ranged up to 50-80% of normal. Nevertheless, their global metabolic rates remained <50% of normal. MEG recordings from three PVS patients provide clear evidence for the absence, abnormality or reduction of evoked responses. Despite major abnormalities, however, these data also provide evidence for localized residual activity at the cortical level. Each patient partially preserved restricted sensory representations, as evidenced by slow evoked magnetic fields and gamma band activity. In two patients, these activations correlate with isolated behavioural patterns and metabolic activity. Remaining active regions identified in the three PVS patients with behavioural fragments appear to consist of segregated corticothalamic networks that retain connectivity and partial functional integrity. A single patient who suffered severe injury to the tegmental mesencephalon and paramedian thalamus showed widely preserved cortical metabolism, and a global average metabolic rate of 65% of normal. The relatively high preservation of cortical metabolism in this patient defines the first functional correlate of clinical- pathological reports associating permanent unconsciousness with structural damage to these regions. The specific patterns of preserved metabolic activity identified in these patients do not appear to represent random survivals of a few neuronal islands; rather they reflect novel evidence of the modular nature of individual functional networks that underlie conscious brain function. The variations in cerebral metabolism in chronic PVS patients indicate that some cerebral regions can retain partial function in catastrophically injured brains.",

  {
    title:     "The novelty P3: an event-related brain potential (ERP) sign of the brain's evaluation of novelty",
    authors:   "David Friedman, Yael M. Cycowicz, Helen Gaeta",
    publisher: "Neuroscience & Biobehavioral Reviews",
    date:      "2001-06-01",
    year:      "2001",
    link:      "https://doi.org/10.1016/s0149-7634(01)00019-7",
    id:        "doi:10.1016/s0149-7634(01)00019-7",
    doi:       "doi:10.1016/s0149-7634(01)00019-7",
    abstract:  "A review of the literature that examines event-related brain potentials (ERPs) and novelty processing reveals that the orienting response engendered by deviant or unexpected events consists of a characteristic ERP pattern, comprised sequentially of the mismatch negativity (MMN) and the novelty P3 or P3a. A wide variety of evidence suggests that the MMN reflects the detection of deviant events, whereas the P3a is associated more with the evaluation of those events for subsequent behavioral action. On the scalp, the novelty P3a is comprised of at least two aspects, one frontal the other posterior, each with different cognitive (and presumably neurologic) correlates. Intracranial ERP investigations and studies of patients with localized brain lesions (and, to some extent, fMRI data) converge with the scalp-recorded data in suggesting a widespread neural network, the different aspects of which respond differentially to stimulus and task characteristics.",

  {
    title:     "Interconnected Large-Scale Systems for Three Fundamental Cognitive Tasks Revealed by Functional MRI",
    authors:   "Joy Hirsch, Diana V. Rodriguez-Moreno, Karl H. S. Kim",
    publisher: "Journal of Cognitive Neuroscience",
    date:      "2001-05-01",
    year:      "2001",
    link:      "https://doi.org/10.1162/08989290151137421",
    id:        "doi:10.1162/08989290151137421",
    doi:       "doi:10.1162/08989290151137421",
    abstract:  "The specific brain areas required to execute each of three fundamental cognitive tasks - object naming, same-different discrimination, and integer computation - are determined by whole-brain functional magnetic resonance imaging (fMRI) using a novel technique optimized for the isolation of neurocognitive systems. This technique (1) conjoins the activity associated with identical or nearly identical tasks performed in multiple sensory modalities (conjunction) and (2) isolates the activity conserved across multiple subjects (conservation). Cortical regions isolated by this technique are, thus, presumed associated with cognitive functions that are both distinguished from primary sensory processes and from individual differences. The object-naming system consisted of four brain areas: left inferior frontal gyrus, Brodmann's areas (BAs) 45 and 44; left superior temporal gyrus, BA 22; and left medial frontal gyrus, BA 6. The same-different discrimination system consisted of three brain areas: right inferior parietal lobule, BA 40; right precentral gyrus, BA 6; and left medial frontal gyrus, BA 6. The integer computation system consisted of five brain areas: right middle frontal gyrus, BA 6; right precentral gyrus, BA 6; left inferior parietal lobule, BA 40; left inferior frontal gyrus, BA 44; and left medial frontal gyrus, BA 6. All three neurocognitive systems shared one common cortical region, the left medial frontal gyrus, the object-naming and integer computation systems shared the left inferior frontal gyrus, and the integer computation and same-different discrimination systems shared the right precentral gyrus. These results are consistent with connectionist models of cognitive processes where specific sets of remote brain areas are assumed to be transiently bound together as functional units to enable these functions, and further suggest a superorganization of neurocognitive systems where single brain areas serve as elements of multiple functional systems.",

  {
    title:     "Remembering the Color of Objects: An ERP Investigation of Source Memory",
    authors:   "Yael M. Cycowicz, David Friedman, Joan Gay Snodgrass",
    publisher: "Cerebral Cortex",
    date:      "2001-04-01",
    year:      "2001",
    link:      "https://doi.org/10.1093/cercor/11.4.322",
    id:        "doi:10.1093/cercor/11.4.322",
    doi:       "doi:10.1093/cercor/11.4.322",
    abstract:  "Subjects studied pictures of common objects outlined in either red or green and were asked to memorize the objects and their associated colors. Event-related potentials (ERPs) were recorded during subsequent inclusion (i.e. item) and exclusion (i.e. source) memory tasks. The main goal of the experiment was to determine if brain signatures for familiarity and recollection, two behavioral processes thought to account for episodic memory performance, would be observed in the pattern of ERP results. For correctly recognized items, early, posterior old/new effects were recorded (approximately 300--600 ms) that did not differ in magnitude or scalp distribution between item and source memory tasks. A subsequent long-duration occipitally focused negativity (approximately 800 ms peak) was evident in the source but not the item memory task. The ERPs associated with 'source errors' in the source memory task also showed robust early old/new effects. However, 'source error' ERPs lacked frontal scalp activity compared to those associated with correct source attribution. The data suggest that a recollective response may require frontal involvement whereas a decision based on familiarity may not.",

  {
    title:     "Recognition and source memory for pictures in children and adults",
    authors:   "Yael M. Cycowicz, David Friedman, Joan Gay Snodgrass, Martin Duff",
    publisher: "Neuropsychologia",
    date:      "2001-01-01",
    year:      "2001",
    link:      "https://doi.org/10.1016/s0028-3932(00)00108-1",
    id:        "doi:10.1016/s0028-3932(00)00108-1",
    doi:       "doi:10.1016/s0028-3932(00)00108-1",
    abstract:  "The present experiment investigated the developmental aspects of source compared to item memory. College students and 7-8-year-old children viewed pictures drawn in red or green during a study phase, and were asked either to remember the pictures for a subsequent recognition test, or to remember both the pictures and their associated colors for a subsequent source memory test. In the test phase, new and old pictures were presented in black. In the recognition task, participants were asked to make binary old/new recognition judgments, while in the source task, they were asked to make trinary old-green/old-red/new source judgements. Performance on all tasks improved with increasing age, but the age difference for source was much larger than that for item memory. It has been suggested that the frontal lobes play a critical role in the retrieval of source information, and that this brain region relative to the medial temporal lobes continues to develop into late adolescence. Thus, it is possible that immaturity of the frontal lobes may be causally related to the children's lower performance on the source memory task.",

  {
    title:     "Memory development and event-related brain potentials in children",
    authors:   "Yael M. Cycowicz",
    publisher: "Biological Psychology",
    date:      "2000-10-01",
    year:      "2000",
    link:      "https://doi.org/10.1016/s0301-0511(00)00055-7",
    id:        "doi:10.1016/s0301-0511(00)00055-7",
    doi:       "doi:10.1016/s0301-0511(00)00055-7",
    abstract:  "This review examines the evidence for the maturation of memory function during childhood using event-related brain potentials (ERP), and behavioral measures. It has been shown that brain structures implicated in different forms of memory mature during the first and into the second decade of life. Whereas the maturation rates of implicit and explicit memory have not been directly assessed in the literature, studies of the maturation of the corresponding brain regions imply that there should be a progression in the maturation of the different forms of memory. This review also motivates the use of brain imaging techniques for investigation of memory systems during the developing years. Although, only a handful of such studies with children are currently available, they demonstrate that such techniques can provide information that may be unavailable otherwise. For example, when children fail to generate the ERP old/new effect, an index of episodic retrieval, it has been suggested that they may lack the necessary pre-existing representations in their long-term lexical or semantic memories. Similarly, age- related differences in ERP scalp topography during source memory paradigms suggest that children, who do not appear to show frontal scalp activity, lack inputs from frontal regions that are necessary for successful retrieval of source information. Future research with children will reveal more details about the nature of mnemonic processing during the developmental years.",

  {
    title:     "A Developmental Trajectory in Implicit Memory is Revealed by Picture Fragment Completion",
    authors:   "Yael M. Cycowicz, David Friedman, Joan Gay Snodgrass, Mairav Rothstein",
    publisher: "Memory",
    date:      "2000-01-01",
    year:      "2000",
    link:      "https://doi.org/10.1080/096582100387687",
    id:        "doi:10.1080/096582100387687",
    doi:       "doi:10.1080/096582100387687",
    abstract:  "Dissociations between performance on implicit and explicit tasks have often been taken as evidence that different neural structures subserve the two types of memory. One such dissociation involves developmental differences that emerge in explicit tasks, but which appear to be absent in implicit tasks. Such findings are consistent with the idea that implicit memory is subserved by a more primitive system that evolves earlier at both phylogenetic and ontogenetic levels. The present paper reviews previous studies that claimed to find evidence that implicit memory is fully developed in very young children. Issues of measurement error, ceiling effects, and insufficient power brought up questions about those studies with respect to the developmental issue. The present study compares performance on implicit (picture fragment completion) and explicit (free recall and recognition) memory tasks with groups ranging in age from 5-28 years. We find a reliable developmental trend in both implicit and explicit performance in which the former cannot be attributed to the operation of explicit memory processes. Thus, we conclude that implicit memory, like explicit memory, develops with age.",

  {
    title:     "ERP recordings during a picture fragment completion task: effects of memory instructions",
    authors:   "Yael M. Cycowicz, David Friedman",
    publisher: "Cognitive Brain Research",
    date:      "1999-10-01",
    year:      "1999",

    id:        "doi:10.1016/s0926-6410(99)00031-2",
    doi:       "doi:10.1016/s0926-6410(99)00031-2",
    abstract:  "Sequential implicit (picture fragment completion) and explicit (free recall and recognition) memory tasks were performed by two groups of young adults. Subjects assigned to the intentional condition were asked to memorize the stimuli presented during the picture fragment completion task, whereas subjects assigned to the incidental condition were not so instructed. In the picture fragment completion task, all subjects showed savings (priming), i.e., their identification thresholds for previously seen fragments were lower than those for fragments not previously seen, and no between-group performance difference was found. Free recall performance was better for the intentional than the incidental group, but recognition performance did not differ between the groups. Despite similar between-group performance, event-related brain potentials (ERPs) recorded during the picture fragment completion and recognition tasks revealed between-group differences in information processing. The ERP data suggest that similar behavioral performance during memory tasks may have been associated with distinct neuronal mechanisms subserving priming and recollection.",

  {
    title:     "The effect of intention to learn novel, environmental sounds on the novelty P3 and old/new recognition memory",
    authors:   "Yael M. Cycowicz, David Friedman",
    publisher: "Biological Psychology",
    date:      "1999-05-01",
    year:      "1999",
    link:      "https://doi.org/10.1016/s0301-0511(99)00004-6",
    id:        "doi:10.1016/s0301-0511(99)00004-6",
    doi:       "doi:10.1016/s0301-0511(99)00004-6",
    abstract:  "Brain electrical activity was recorded while 32 young adults listened to frequent tones, infrequent target tones, and infrequent novel environmental sounds (some of which repeated). Subjects in the incidental group were not informed about the novel sounds, while subjects in the intentional group were informed and, in addition, were asked to memorize them for a subsequent memory test. Following the novelty oddball task, all subjects were given an old/new sound recognition memory task. The novelty P3 showed a more anterior scalp distribution and an effect of repetition in the incidental compared to the intentional group, suggesting that pre- categorizing the novel sounds influenced how they were processed. For the intentional group only, a subsequent memory effect was elicited by novel sounds that were subsequently recognized compared to those that were not, although both groups showed robust old/new ERP effects during the recognition task. The robust subsequent memory effects in the intentional group were associated with greater recognition accuracy of familiar environmental sounds relative to the incidental group. These data suggest that the encoding activity reflected in the ERP subsequent memory effect may have engendered an advantage in subsequent recognition memory performance.",

  {
    title:     "Effects of aging on the novelty P3 during attend and ignore oddball tasks",
    authors:   "David Friedman, Victoria A. Kazmerski, Yael M. Cycowicz",
    publisher: "Psychophysiology",
    date:      "1998-09-01",
    year:      "1998",
    link:      "https://doi.org/10.1017/s0048577298970664",

    doi:       "doi:10.1017/s0048577298970664",
    abstract:  "The effects of attention were assessed on novelty P3 amplitude and scalp distribution elicited by environmental sounds in young and elderly volunteers who participated in either actively attended or ignored oddball conditions. For the young, novelty P3 amplitude decreased with time on task during both attend and ignore sequences. Amplitude decrements were greatest at frontal sites during the attend condition, but at all sites during the ignore condition. A reliable amplitude decrement was not observed for the elderly in either the attend or ignore oddball series. The data suggest that attention differentially activates multiple generators that contribute to scalp-recorded novelty P3 activity. The lack of novelty P3 habituation seen in the elderly is consistent with changes in frontal lobe function as age increases.",

  {
    title:     "Effect of Sound Familiarity on the Event-Related Potentials Elicited by Novel Environmental Sounds",
    authors:   "Yael M. Cycowicz, David Friedman",
    publisher: "Brain and Cognition",
    date:      "1998-02-01",
    year:      "1998",
    link:      "https://doi.org/10.1006/brcg.1997.0955",

    doi:       "doi:10.1006/brcg.1997.0955",
    abstract:  "The effect of sound familiarity was examined within the context of an event-related potential (ERP) novelty oddball paradigm. Brain electrical activity was recorded while subjects (16 young adults) listened to frequent tones, infrequent target tones, and infrequent novel environmental sounds. Subjects were instructed to press a button in response to the target tones only. There were 48 different novel sounds, 32 of which were repeated, and about two-thirds of which represented familiar sound concepts. The novel sounds elicited two ERP components, the novelty P3 and the P32. The novelty P3 was modulated by both repetition and familiarity, such that repeated familiar sounds elicited decreased novelty P3 amplitude at frontal sites, while repeated unfamiliar sounds elicited increased novelty P3 amplitude at posterior sites. This differential effect may reflect the operation of a neural network that distinguishes among different degrees of novelty.",

  {
    title:     "A developmental study of the effect of temporal order on the ERPs elicited by novel environmental sounds",
    authors:   "Yael M. Cycowicz, David Friedman",
    publisher: "Electroencephalography and Clinical Neurophysiology",
    date:      "1997-08-01",
    year:      "1997",
    link:      "https://doi.org/10.1016/s0013-4694(97)96053-3",
    id:        "doi:10.1016/s0013-4694(97)96053-3",
    doi:       "doi:10.1016/s0013-4694(97)96053-3",
    abstract:  "Event-related brain potentials (ERPs) were recorded from 16 subjects in each of the following age groups, 5-7, 9-11, 14-16, and 20-28 years of age. Subjects performed a novelty oddball task, in which frequent, standard tones (80% probability) were intermixed with infrequent tones to which the subject responded (10%), along with 48 unique novel, environmental sounds (10%). Analyses focused on the effects of temporal order (either serial order within the block or block number) in interaction with age group on the ERPs to the novel sounds. The amplitude and scalp distribution of two ERP components were analyzed, the 'novelty P3,' assumed to reflect aspects of the orienting response, and the P32, a component that may be synonymous with the P3b. Evidence suggests that the frontal aspect of the scalp distribution of the novelty P3 depends upon the integrity of the prefrontal cortex. Temporal order produced systematic (primarily linear) reductions in novelty P3 amplitude that were greater at frontal than posterior electrode sites. The P3(2) did not show consistent effects of temporal order. Both of these phenomena were highly similar for all four age groups. It is concluded that the brain's response to novelty is similar across a wide age range, involving a neural circuit with both frontal and posterior elements.",

  {

    authors:   "Yael M. Cycowicz, David Friedman, Mairav Rothstein, Joan Gay Snodgrass",
    publisher: "Journal of Experimental Child Psychology",
    date:      "1997-05-01",

    link:      "https://doi.org/10.1006/jecp.1996.2356",
    id:        "doi:10.1006/jecp.1996.2356",
    doi:       "doi:10.1006/jecp.1996.2356",
    abstract:  "Researchers concerned with the development of cognitive functions are in need of standardized material that can be used with both adults and children. The present article provides normative measures for 400 line drawings viewed by 5- and 6-year-old children. The three variables obtained-name agreement, familiarity, and visual complexity-are important because of their potential effect on memory and other cognitive processes. The normative data collected in the present study indicate that young children are different from adults in both the name most frequently assigned and the number of alternative names provided. The alternative names given by the children are either coordinate names or names of objects that are visually similar to the pictured object. In addition, the failure (to name) rate is higher among young children compared to adults. Thus, we conclude that unequivocal interpretation of age-related differences in cognitive functions can be made only when age-appropriate pictorial stimuli are chosen.",

  {

    authors:   "Yael M. Cycowicz, David Friedman, Mairav Rothstein",
    publisher: "Psychophysiology",
    date:      "1996-11-01",
    year:      "1996",
    link:      "https://doi.org/10.1111/j.1469-8986.1996.tb02364.x",
    id:        "doi:10.1111/j.1469-8986.1996.tb02364.x",
    doi:       "doi:10.1111/j.1469-8986.1996.tb02364.x",
    abstract:  "Event-related potentials were recorded from participants 5-7, 9-11, 14-16, and 22-28 years old during an auditory novelty oddball task. In this task, stimuli about which the participant is not instructed (i.e., novel or uncategorized) typically elicit a more frontally oriented P3 scalp topography (novelty P3). In contrast, stimuli to which the participant must respond (i.e., target or precategorized) elicit a P3 with a more posterior scalp topography. Repetition of identical novel stimuli led to a similar reduction in novelty P3 amplitude for all age groups. Moreover, with repetition the shift in scalp topography of the novelty P3 to a more parietally oriented distribution was similar in children and adults. A second component, the P32 (assumed to be an analog of the P3b), exhibited a repetition priming effect in both the adults and the youngest children. The fact that age-related differences induced by novel repetition were small and not systematic indicates that the processing of novel information is similar across a wide age range.",

  {

    authors:   "Monica Fabiani, Victoria A. Kazmerski, Yael M. Cycowicz, David Friedman",
    publisher: "Psychophysiology",
    date:      "1996-07-01",
    year:      "1996",
    link:      "https://doi.org/10.1111/j.1469-8986.1996.tb01072.x",
    id:        "doi:10.1111/j.1469-8986.1996.tb01072.x",
    doi:       "doi:10.1111/j.1469-8986.1996.tb01072.x",
    abstract:  "Brief nontonal sounds are used in electrophysiology in the novelty oddball paradigm. These sounds vary in the brain activity they elicit and in the degree to which they can be identified, named, and remembered. Because ease of sound identification may influence sound processing, naming and conceptual norms were determined for 100 sounds for 77 young adults (Experiment 1). Naming ability decreases in normal and pathological aging. Therefore, norms were also derived for older adults (Experiment 2) and for probable Alzheimer's disease patients (Experiment 3). With respect to the young adults, perseverative naming behavior increased in these groups, and sound and picture naming performance were correlated. In Experiment 4, the sound-naming performance of children aged 5-6, 9-11, and 14-16 years was compared. Name and conceptual agreements improved with age, whereas perseverative behavior decreased. These normative data should be useful in guiding sound selection in future studies and help clarify the relationships between sound naming and other variables, including direct and indirect memory performance.",
