  - type: "Poster"
  title: "Perceived Family Support Negatively Correlates with PTSD Symptomology Among 9/11 Responders"
  authors: Genesis Moran, Daniel Craft, Diana V. Rodriguez-Moreno, Yael M. Cycowicz
  date: 2024
  poster: "images/ISTSS2024_GenesisMoran_ITT.pdf"
  abstract: Social Support is defined as a deliberate attempt to exhibit support for an individual and can further be explored through the modality of support and nature of an individual’s social network/ relationships. Former research on the relationship between social support and PTSD severity has yielded: Less severe avoidance, arousal, and intrusion symptoms for those reporting greater support. Heightened levels of perceived support from romantic partners negatively associated with overall PTSD severity. A positive correlation between partner involved therapeutic interventions and improvements in PTSD symptoms. 
  
  - type: "Poster"
  title: "Modulation of Inhibitory Control Across High and Low Energy Food in Healthy Adults"
  authors: Diana V. Rodriguez-Moreno, Angela Rocchi, Surim Kang, Yael M. Cycowicz
  poster: "images/Modulation of Inhibitory Control Across High and Low Energy Food in Healthy Adults.pdf"
  abstract: Maintaining healthy weight requires balancing food consumption and energy expenditure. Unfortunately,increased availability of food, especially high energy (calorie dense) foods, increases appetitive drive and challenges inhibitory control in dietary decision making. Understanding the neural basis of inhibitory control for food cues could inform mechanisms underlying obesity and other food-related disorders. Inhibitory control has been assessed by a variety of tasks which reveal an individual’s ability to suppress prepotent responses. Inhibition is reflected in behavioral outcomes as response accuracy. In a food Go/No-Go task there were more commission errors with shorter RT to food cues compared to nonfood cues. The N2 and P3 of the ERP in Go/No-Go tasks are assumed to represent inhibitory control processes. ERP studies of food Go/No-go tasks varied in their outcomes due to methodological differences. We created a modified food Go/No-Go in which the Go stimuli were 6 repeated animal pictures and the No-Go images were either non-repeated non-food, or non-repeated high and low caloric food images. We hypothesized that No-Go food cues will engage inhibitory control process more than non-food cues that will be reflected in N2 amplitude. We also expect larger N2 amplitude for the high calorie foods compare with low calorie foods.

  - type: "Poster"
  title: "Neural Activity Based on Reaction Time During Impulsive Decision Making"
  authors: Xiaoxiao Sun, Yael M. Cycowicz, Diana V. Rodriguez-Moreno, Christina W. Hoven, Lawrence V. Amsel
  poster: "images/Neural Activity Based on Reaction Time During Impulsive Decision Making.pdf"
  abstract: Delay discounting (DD) tasks measure the capacity to postpone gratification. They define reward-impulsivity as a preference for sooner smaller (SS) over larger later (LL) rewards. Choices that are made more quickly also involve reward-impulsivity, i.e., fast responses executed by rapid neural processes, often focused on getting a reward, not maximizing it. Hypotheses: Fast and slow choices indicated by reaction times (RT) reflect more than valuation comparisons, they involve reward-impulsivity or evidence accumulation, and each of these is reflected in unique neural activities.

  - type: "Poster"
  title: "Novelty P3 Amplitude Differentiation for Food and Non-food Stimuli"
  authors: "Yael M. Cycowicz, Ida Jamshidy, Weiru Xu, Diana V. Rodriguez-Moreno"
  poster: "images/Novelty_P3_Amplitude_Differentiation_for_Food_and_Non-food_Stimuli.pdf"
  abstract: In recent years there has been a dramatic increase in the prevalence of overweight and obese individuals around the world. In our obesogenic environment the abundance of food cues may result in unhealthy food-related decision making. While the etiology of obesity is multifactorial, we postulate that increased attention to food cues may contribute to over-eating.
  
- type: "Poster"
  title: "Childhood Trauma Legacy: Emotional Memory and Neural Response to 9/11-Related Stimuli"
  authors: "Yael M. Cycowicz, Rachel Goldblum, Daniel Craft, Christina W. Hoven, Diana V. Rodriguez-Moreno"
  date: "2024"
  poster: "images/SPR_2024_Cycowicz final.pdf"
  abstract: Children and adolescents exposed to the 9/11 WTC attack continue to face neuropsychological and emotional challenges in adulthood.15 years after 9/11, exposed children were more likely to have mental health disorders compared to non-exposed peers. Mental health disorders are associated with deficits in neuronal networks involved in emotion regulation, cognitive control and memory. Neurobiological circuits underlying regulation, control and memory undergo significant development during childhood and adolescence, making these periods especially vulnerable to traumatic experiences.
  
- type: "Poster"
  title: "Emotional Reactivity in Adults with Childhood Exposure to 9/11 Trauma"
  authors: "Diana V. Rodriguez-Moreno, Daniel Craft, Rachel Goldblum, Winnie Wei-Yi Chang, Kristina Villant, Rachel Goldblum, Christina W. Hoven, Yael M. Cycowicz"
  date: "2024"
  poster: "images/SRP_2024_RodriguezMoreno_final.pdf"
  abstract: Examine behavioral and brain activation differences in threat reactivity between exposed groups with and without mental health disorders. We expect that individuals exposed to the 9/11 terror attack during childhood will exhibit heightened emotional reactivity to threat, particularly those with psychiatric disorders.
