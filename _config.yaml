# site properties and page defaults
title: Neuro-Cognition and Emotion Lab 
subtitle: 
description: An engaging 1-3 sentence description of your lab.
header: images/background.jpeg
header-dark: false
footer: images/background.jpeg
footer-dark: false
proofer: false
logo: images/logo.jpg

# site social media and other links
links:
  email: contact@NCELab.com
  orcid: 0000-0001-8713-9213
  google-scholar: ETJoidYAAAAJ
  github: NCELab
  twitter: NCELab
  youtube: NCELab

### jekyll settings

# front matter defaults
defaults:
  # all markdown files
  - scope:
      path: ""
    values:
      layout: default
  # markdown files in /_members
  - scope:
      type: "members"
    values:
      layout: member
  # markdown files in /_posts
  - scope:
      type: "posts"
    values:
      layout: post
  # markdown files in /projects
  - scope:
      type: "projects"
    values:
      layout: project

collections:
  members:
    output: true
  posts:
    output: true
  projects:
    output: true
  get-involved:
    output: true 

# jekyll plugins
plugins:
  - jekyll-spaceship
  - jekyll-sitemap
  - jekyll-redirect-from
  - jekyll-feed
  - jekyll-last-modified-at

# code block syntax highlighting
highlighter: rouge

# jekyll theme
theme: null

# sass settings
sass:
  sass_dir: _styles

# force jekyll to include certain files/folders
include:
  - _styles
  - _scripts

# force jekyll to exclude certain files/folders
exclude:
  - README.md
  - LICENSE.md
  - CITATION.cff
