# site properties and page defaults
title: Neuro-Cognition and Emotion Lab 
subtitle: 
description: "The Neuro-Cognition and Emotion Lab (NCEL) at Columbia University and the New York State Psychiatric Institute (NYSPI) investigates how emotion, memory, and decision-making interact in the human brain. Using behavioral experiments, EEG, and fMRI, we study how emotional experiences influence cognitive control, learning, and mental health."
header: images/background.jpeg
header-dark: false
footer: images/background.jpeg
footer-dark: false
proofer: false
logo: images/logo.jpg

# site social media and other links
links:
  email: NCEL@nyspi.columbia.edu
  github: NCELab

### jekyll settings

# front matter defaults
defaults:
  # all markdown files
  - scope:
      path: ""
    values:
      layout: default
  # markdown files in /_members
  - scope:
      type: "members"
    values:
      layout: member
  # markdown files in /_posts
  - scope:
      type: "posts"
    values:
      layout: post
  # markdown files in /projects
  - scope:
      type: "projects"
    values:
      layout: project

collections:
  members:
    output: true
  posts:
    output: true
  projects:
    output: true
  get-involved:
    output: true 

# jekyll plugins
plugins:
  - jekyll-spaceship
  - jekyll-sitemap
  - jekyll-redirect-from
  - jekyll-feed
  - jekyll-last-modified-at

# code block syntax highlighting
highlighter: rouge

# jekyll theme
theme: null

# sass settings
sass:
  sass_dir: _styles

# force jekyll to include certain files/folders
include:
  - _styles
  - _scripts

# force jekyll to exclude certain files/folders
exclude:
  - README.md
  - LICENSE.md
  - CITATION.cff
